<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="0929_clock.css" />
    <script src="0929_clock.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="dot"></div>
      <div class="sec">
        <div class="up secUp"></div>
        <div class="down secDown"></div>
      </div>
      <div class="min">
        <div class="up minUp"></div>
        <div class="down minDown"></div>
      </div>
      <div class="hour">
        <div class="up hourUp"></div>
        <div class="down hourDown"></div>
      </div>
    </div>
  </body>
</html>
